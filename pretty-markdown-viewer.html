<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pretty Markdown Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #fafafa;
      --paper: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --border-strong: #9ca3af;
      --code-bg: #f3f4f6;
      --quote-bg: #f9fafb;
      --link: #0f62fe;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    html {
      font-size: 18px;
    }

    body {
      margin: 0;
      padding: 2rem 1.25rem 3rem;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      padding: 1rem 1.1rem;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      flex-wrap: wrap;
    }

    .title {
      font-size: 1rem;
      font-weight: 700;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--text);
    }

    .subtle {
      color: var(--muted);
      font-size: 0.95rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    input[type="file"] {
      font: inherit;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      padding: 0.45rem 0.55rem;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    button {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      padding: 0.58rem 0.9rem;
      font-size: 0.95rem;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    button:hover {
      background: #f8fafc;
    }

    .paper {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 2.5rem 3rem;
      overflow-wrap: break-word;
    }

    #content > *:first-child {
      margin-top: 0;
    }

    #content > *:last-child {
      margin-bottom: 0;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      line-height: 1.25;
      color: #111827;
      margin-top: 2em;
      margin-bottom: 0.65em;
    }

    h1 {
      font-size: 2.1rem;
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.35rem;
      margin-top: 0;
    }

    h2 {
      font-size: 1.65rem;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 0.25rem;
    }

    h3 {
      font-size: 1.3rem;
    }

    p, ul, ol, blockquote, table, pre {
      margin-top: 1rem;
      margin-bottom: 1rem;
    }

    ul, ol {
      padding-left: 1.5rem;
    }

    li + li {
      margin-top: 0.3rem;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    blockquote {
      margin-left: 0;
      padding: 0.9rem 1rem;
      background: var(--quote-bg);
      border-left: 5px solid var(--border-strong);
      color: #374151;
      border-radius: 8px;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92em;
      background: var(--code-bg);
      padding: 0.16rem 0.38rem;
      border-radius: 6px;
    }

    pre {
      background: var(--code-bg);
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 1rem 1.1rem;
      overflow-x: auto;
    }

    pre code {
      background: transparent;
      padding: 0;
      border-radius: 0;
      font-size: 0.9rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.98rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: block;
      overflow-x: auto;
      white-space: nowrap;
      background: white;
    }

    thead th {
      background: #f3f4f6;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-weight: 700;
      border-bottom: 2px solid var(--border-strong);
    }

    th, td {
      padding: 0.8rem 0.9rem;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      vertical-align: top;
    }

    tbody tr:nth-child(even) {
      background: #fcfcfd;
    }

    tbody tr:hover {
      background: #f9fafb;
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .empty {
      color: var(--muted);
      font-style: italic;
    }

    @media (max-width: 700px) {
      html {
        font-size: 17px;
      }

      .paper {
        padding: 1.4rem 1rem;
        border-radius: 14px;
      }

      .toolbar {
        padding: 0.85rem;
      }

      h1 {
        font-size: 1.7rem;
      }

      h2 {
        font-size: 1.4rem;
      }
    }

    @media print {
      :root {
        --bg: #ffffff;
        --paper: #ffffff;
        --text: #000000;
        --muted: #444444;
        --border: #bdbdbd;
        --border-strong: #888888;
        --code-bg: #f6f6f6;
        --quote-bg: #fafafa;
        --link: #000000;
        --shadow: none;
      }

      html {
        font-size: 12pt;
      }

      body {
        background: #ffffff;
        padding: 0;
        margin: 0;
      }

      .toolbar {
        display: none !important;
      }

      .wrap {
        max-width: none;
        margin: 0;
      }

      .paper {
        border: none;
        box-shadow: none;
        border-radius: 0;
        padding: 0;
      }

      a {
        text-decoration: none;
        color: #000;
      }

      h1, h2, h3, h4 {
        page-break-after: avoid;
      }

      table, pre, blockquote, img {
        page-break-inside: avoid;
      }

      p, li {
        orphans: 3;
        widows: 3;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <div class="toolbar-left">
        <div>
          <div class="title">Pretty Markdown Viewer</div>
          <div class="subtle">Open a local .md file and read it with clean formatting</div>
        </div>
        <input type="file" id="fileInput" accept=".md,.markdown,.txt" />
      </div>
      <button onclick="window.print()">Print / Save as PDF</button>
    </div>

    <div class="paper">
      <div id="content" class="empty">Choose a Markdown file to display it here.</div>
    </div>
  </div>

  <script>
    const input = document.getElementById("fileInput");
    const content = document.getElementById("content");

    input.addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const text = await file.text();
      content.classList.remove("empty");
      content.innerHTML = marked.parse(text);
      document.title = file.name + " - Markdown Viewer";
    });
  </script>
</body>
</html>
